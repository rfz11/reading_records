\u003e\u660e\u7684\u4eba\u5462\uff1f\\n\u2014\u2014\u7b54\u6848\u662f\u6709\u7684\u3002\u4e0d\u4ec5\u6709\uff0c\u800c\u4e14\u4ed6\u4eec\u7684\u6545\u003cbr\u003e\u4e8b\u6bd4\u4fdd\u5b88\u6d3e\u66f4\u5177\u60b2\u5267\u8272\u5f69\uff0c\u56e0\u4e3a\u4ed6\u4eec\u8bd5\u56fe\u201c\u5272\u8089\u8865\u75ae\u201d\uff0c\u003cbr\u003e\u6700\u7ec8\u5374\u53d1\u73b0\u65e2\u6551\u4e0d\u4e86\u5927\u6e05\uff0c\u4e5f\u4fdd\u4e0d\u4f4f\u81ea\u5df1\u3002\\n\u30101. \u003cbr\u003e\u6ee1\u6d32\u8d35\u65cf\u7684\u201c\u89c9\u9192\u8005\u201d\uff1a\u7aef\u65b9\u4e0e\u826f\u5f3c\\n\u7aef\u65b9\uff08\u6ee1\u6d32\u6b63\u767d\u003cbr\u003e\u65d7\uff0c\u6258\u5fd2\u514b\u6c0f\uff09\uff1a\u4ed6\u662f\u665a\u6e05\u6ee1\u6d32\u8d35\u65cf\u4e2d\u6700\u5f00\u660e\u7684\u6539\u9769\u6d3e\u3002\u003cbr\u003e\u4f5c\u4e3a\u5c01\u7586\u5927\u540f\uff0c\u4ed6\u4e0d\u4ec5\u4e0d\u6392\u65a5\u7acb\u5baa\uff0c\u53cd\u800c\u57281905\u5e74\uff08\u003cbr\u003e\u620a\u620c\u53d8\u6cd5\u7684\u5ef6\u7eed\uff09\u4e3b\u52a8\u8bf7\u6c42\u51fa\u56fd\u8003\u5bdf\u653f\u6cbb\u3002\u4ed6\u5927\u529b\u5174\u529e\u65b0\u003cbr\u003e\u5f0f\u5b66\u5802\u3001\u5f15\u8fdb\u897f\u5f0f\u8b66\u5bdf\u5236\u5ea6\u3001\u4fdd\u62a4\u6587\u7269\uff08\u521b\u529e\u4e2d\u56fd\u7b2c\u4e00\u4e2a\u003cbr\u003e\u73b0\u4ee3\u535a\u7269\u9986\uff09\u3002\u4ed6\u7684\u903b\u8f91\u662f\uff1a\u4e3a\u4e86\u4fdd\u4f4f\u6ee1\u4eba\u7684\u7edf\u6cbb\uff0c\u5fc5\u987b\u003cbr\u003e\u653e\u5f03\u201c\u9a91\u5c04\u201d\u7684\u65e7\u76ae\u56ca\uff0c\u6362\u4e0a\u201c\u5baa\u653f\u201d\u7684\u65b0\u88c5\u3002\\n\\n\u003cbr\u003e\u826f\u5f3c\uff08\u6ee1\u6d32\u9576\u9ec4\u65d7\uff0c\u7231\u65b0\u89c9\u7f57\u6c0f\uff09\uff1a\u4ed6\u662f\u7687\u65cf\u4e2d\u7684\u519b\u4e8b\u5929\u003cbr\u003e\u624d\uff0c\u4e5f\u662f\u5b97\u793e\u515a\u7684\u6838\u5fc3\u3002\u4ed6\u867d\u7136\u662f\u575a\u5b9a\u7684\u4fdd\u7687\u6d3e\uff0c\u4f46\u4ed6\u4fdd\u003cbr\u003e\u7684\u662f\u201c\u541b\u4e3b\u7acb\u5baa\u201d\u7684\u7687\uff0c\u800c\u975e\u201c\u4e13\u5236\u201d\u7684\u7687\u3002\u4ed6\u6781\u5ea6\u53cd\u611f\u003cbr\u003e\u8150\u8d25\u548c\u65e0\u80fd\u7684\u65e7\u8d35\u65cf\uff0c\u81f4\u529b\u4e8e\u63a8\u8fdb\u73b0\u4ee3\u5316\u519b\u961f\u6539\u9769\u3002\u4ed6\u613f\u003cbr\u003e\u610f\u4e3a\u4e86\u5927\u5c40\u88c1\u64a4\u5197\u5458\u3001\u5237\u65b0\u540f\u6cbb\uff0c\u8bd5\u56fe\u901a\u8fc7\u201c\u5272\u8d35\u65cf\u7684\u8089\u003cbr\u003e\u201d\u6765\u5ef6\u7eed\u738b\u671d\u7684\u547d\u3002\\n\\n2. \u6c49\u65cf\u58eb\u5927\u592b\u7684\u201c\u52a1\u5b9e\u003cbr\u003e\u6d3e\u201d\uff1a\u5f20\u4e4b\u6d1e\u4e0e\u8881\u4e16\u51ef\\n\u867d\u7136\u4f60\u5f15\u7528\u4e86\u5f20\u4e4b\u6d1e\u90a3\u53e5\u201c\u5c0f\u003cbr\u003e\u671d\u5ef7\u4e4b\u5927\u81e3\u201d\u7684\u8bdd\uff0c\u4f46\u8fd9\u5176\u5b9e\u662f\u4ed6\u5728\u7279\u5b9a\u73af\u5883\u4e0b\u7684\u201c\u81ea\u4fdd\u003cbr\u003e\u201d\u4e4b\u8a00\uff0c\u5e76\u975e\u4ed6\u7684\u5168\u90e8\u3002\\n\\n\u5f20\u4e4b\u6d1e\uff1a\u4ed6\u665a\u5e74\u7684\u884c\u4e3a\u003cbr\u003e\u5426\u5b9a\u4e86\u90a3\u53e5\u8bdd\u3002\u4f5c\u4e3a\u6d0b\u52a1\u8fd0\u52a8\u7684\u6bbf\u519b\uff0c\u4ed6\u5728\u620a\u620c\u53d8\u6cd5\u4e2d\u867d\u003cbr\u003e\u7136\u53cd\u5bf9\u5eb7\u6709\u4e3a\u7684\u6fc0\u8fdb\uff08\u56e0\u4e3a\u5eb7\u8981\u5e9f\u79d1\u4e3e\uff0c\u65ad\u58eb\u4eba\u6839\u57fa\uff09\uff0c\u003cbr\u003e\u4f46\u4ed6\u6781\u529b\u4e3b\u5f20\u201c\u4e2d\u4f53\u897f\u7528\u201d\uff0c\u5174\u5b9e\u4e1a\u3001\u7ec3\u65b0\u519b\u3001\u529e\u65b0\u5b66\u3002\u003cbr\u003e\u4ed6\u613f\u610f\u5272\u8ba9\u7684\u201c\u5229\u76ca\u201d\u662f\u4f20\u7edf\u5112\u5b66\u7684\u5784\u65ad\u5730\u4f4d\uff0c\u5f15\u5165\u897f\u5b66\u003cbr\u003e\u3002 \u4ed6\u540e\u6765\u7684\u300a\u529d\u5b66\u7bc7\u300b\u6838\u5fc3\u5c31\u662f\uff1a\u4e0d\u6539\uff0c\u8fde\u5c0f\u671d\u5ef7\u90fd\u6ca1\u003cbr\u003e\u5f97\u505a\u3002\\n\\n\u8881\u4e16\u51ef\uff1a\u4ed6\u662f\u4f53\u5236\u5185\u7684\u65e2\u5f97\u5229\u76ca\u8005\uff0c\u4f46\u4ed6\u003cbr\u003e\u901a\u8fc7\u5c0f\u7ad9\u7ec3\u5175\uff0c\u5b9e\u9645\u4e0a\u5728\u57f9\u517b\u4e00\u652f\u5fe0\u4e8e\u8fd1\u4ee3\u5316\u5236\u5ea6\u7684\u519b\u961f\u003cbr\u003e\u3002\u4ed6\u613f\u610f\u7528\u65b0\u7684\u519b\u4e8b\u4f53\u7cfb\u53bb\u53d6\u4ee3\u65e7\u6709\u7684\u516b\u65d7\u3001\u7eff\u8425\u5236\u5ea6\u3002\u003cbr\u003e\\n\\n3. \u66fe\u56fd\u85e9\u3001\u5de6\u5b97\u68e0\u7684\u540e\u4eba\uff08\u540d\u95e8\u4e4b\u540e\u7684\u6289\u62e9\u003cbr\u003e\uff09\\n\u6839\u636e\u76f8\u5173\u7814\u7a76\uff0c\u6d0b\u52a1\u6d3e\u7684\u540e\u4ee3\u53cd\u800c\u6210\u4e86\u7ef4\u65b0\u7684\u6025\u5148\u003cbr\u003e\u950b\uff1a\\n\\n\u66fe\u5e7f\u94a7\u3001\u66fe\u5e7f\u6cb3\uff08\u66fe\u56fd\u85e9\u540e\u4eba\uff09\uff1a\u4f5c\u4e3a\u9876\u7ea7\u003cbr\u003e\u8d35\u65cf\u540e\u4ee3\uff0c\u4ed6\u4eec\u4e0d\u4ec5\u6ca1\u6709\u7ef4\u62a4\u65e7\u5236\uff0c\u53cd\u800c\u56e0\u4e3a\u5bb6\u5ead\u718f\u9676\u800c\u003cbr\u003e\u89c6\u91ce\u5f00\u9614\uff0c\u6781\u5ea6\u9119\u89c6\u79d1\u4e3e\u3002\u7532\u5348\u6218\u4e89\u540e\uff0c\u4ed6\u4eec\u6df1\u611f\u201c\u8150\u8d25\u003cbr\u003e\u5df2\u6781\uff0c\u975e\u53d8\u6cd5\u96be\u81ea\u6551\u201d\uff0c\u79ef\u6781\u52a0\u5165\u7ef4\u65b0\u6d3e\uff0c\u4e0e\u8c2d\u55e3\u540c\u3001\u6881\u003cbr\u003e\u542f\u8d85\u4ea4\u5f80\u751a\u5bc6\u3002\\n\\n\u5de6\u5b5d\u540c\uff08\u5de6\u5b97\u68e0\u4e4b\u5b50\uff09\uff1a\u4ed6\u540c\u6837\u003cbr\u003e\u53c2\u4e0e\u4e86\u7ef4\u65b0\u8fd0\u52a8\uff0c\u8bd5\u56fe\u5728\u4f53\u5236\u5185\u8fdb\u884c\u6fc0\u8fdb\u6539\u826f\u3002\\n\\n\u003cbr\u003e\u8fd9\u4e9b\u201c\u5b98\u4e8c\u4ee3\u201d\u7684\u5fc3\u7406\u5f88\u5178\u578b\uff1a \u4ed6\u4eec\u7684\u7236\u8f88\u9760\u6d0b\u52a1\u8d77\u5bb6\u003cbr\u003e\uff0c\u4ed6\u4eec\u6df1\u77e5\u65e7\u5236\u5ea6\u7684\u8150\u673d\uff0c\u613f\u610f\u4e3a\u4e86\u56fd\u5bb6\u547d\u8fd0\u8d4c\u4e0a\u5bb6\u65cf\u7684\u003cbr\u003e\u58f0\u671b\u548c\u5730\u4f4d\u3002\u3011\\n\\n\u2014\u2014\u5eb7\u6709\u4e3a\u5411\u4e0a\u6c42\u89e3\u6cd5\uff0c\u786e\u5ffd\u7565\u003cbr\u003e\u4e86\u5411\u4e0b\u7684\u529b\u91cf\uff0c\u
